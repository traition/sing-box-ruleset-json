name: Export sing-box geoip/geosite groups

on:
  release:
    types: [published]
    repository: lyc8503/sing-box-rules
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Target release tag for traition/sing-box-ruleset-json (e.g. ruleset-from-geoip-2026xxxx)"
        required: true
        default: "manual"

jobs:
  export:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl ca-certificates

      - name: Install sing-box
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Installing sing-box (attempt $i/5)..."
            if curl -fsSL https://sing-box.app/install.sh | sh; then
              break
            fi
            sleep 20
          done
          sudo ln -sf "$(command -v sing-box)" /usr/local/bin/sing-box || true
          sing-box version

      - name: Get sing-box version (for release body)
        id: sbver
        run: |
          set -euo pipefail
          ver="$(sing-box version 2>&1 | tr '\n' ' ')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "$ver"

      - name: Prepare /etc/sing-box
        run: |
          set -euo pipefail
          sudo rm -rf /etc/sing-box
          sudo mkdir -p /etc/sing-box
          sudo chmod 755 /etc/sing-box

      - name: Download geoip.db & geosite.db
        run: |
          set -euo pipefail
          sudo curl -L -o /etc/sing-box/geoip.db \
            https://github.com/lyc8503/sing-box-rules/releases/latest/download/geoip.db
          sudo curl -L -o /etc/sing-box/geosite.db \
            https://github.com/lyc8503/sing-box-rules/releases/latest/download/geosite.db

          ls -lh /etc/sing-box

      - name: Export geoip (from /etc/sing-box)
        run: |
          set -euo pipefail
          cd /etc/sing-box

          geoip_groups="$(sudo sing-box geoip list | awk 'NF{print}')"
          if [ -z "$geoip_groups" ]; then
            echo "No geoip groups found"
            exit 1
          fi

          echo "$geoip_groups" | while IFS= read -r group; do
            [ -n "$group" ] || continue
            echo "Export geoip: $group"
            sudo sing-box geoip export "$group"
          done

      - name: Export geosite (from /etc/sing-box)
        run: |
          set -euo pipefail
          cd /etc/sing-box

          geosite_groups="$(sudo sing-box geosite list | awk '{print $1}' | awk 'NF{print}')"
          if [ -z "$geosite_groups" ]; then
            echo "No geosite groups found"
            exit 1
          fi

          echo "$geosite_groups" | while IFS= read -r group; do
            [ -n "$group" ] || continue
            echo "Export geosite: $group"
            sudo sing-box geosite export "$group"
          done

      - name: Delete config.json
        run: |
          set -euo pipefail
          cd /etc/sing-box

          rm -f /etc/sing-box/config.json || true

          echo "Final /etc/sing-box files:"
          ls -lh /etc/sing-box

      - name: Publish ruleset files to traition/sing-box-ruleset-json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target_tag="${{ inputs.target_tag }}"
            src_name="manual"
          else
            src_tag="${{ github.event.release.tag_name }}"
            src_name="${{ github.event.release.name }}"
            target_tag="ruleset-from-${src_tag}"
          fi

          sb_ver="${{ steps.sbver.outputs.version }}"

          resp="$(curl -sS \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/traition/sing-box-ruleset-json/releases/tags/${target_tag}" || true)"

          exists="$(echo "$resp" | jq -r '.id // empty')"

          if [ -n "$exists" ]; then
            release_id="$exists"
          else
            payload="$(jq -n \
              --arg tag "$target_tag" \
              --arg name "Ruleset ${target_tag}" \
              --arg body "Generated.&#10;&#10;sing-box version: ${sb_ver}" \
              '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')"

            release_create="$(curl -sS -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/traition/sing-box-ruleset-json/releases \
              -d "$payload")"

            release_id="$(echo "$release_create" | jq -r '.id // empty')"

            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "Failed to create release"
              echo "$release_create"
              exit 1
            fi
          fi

          upload_url="$(curl -sS \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/traition/sing-box-ruleset-json/releases/${release_id}" \
            | jq -r '.upload_url')"

          upload_url="${upload_url%\{*}"

          cd /etc/sing-box
          shopt -s nullglob

          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              geoip.db|geosite.db|config.json) continue ;;
            esac

            curl -sS -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              "${upload_url}?name=${f}" \
              --data-binary @"$f"
          done