name: Export sing-box geoip/geosite groups

on:
  release:
    types: [published]
    repository: lyc8503/sing-box-rules
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl ca-certificates

      - name: Install sing-box
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Installing sing-box (attempt $i/5)..."
            if curl -fsSL https://sing-box.app/install.sh | sh; then
              break
            fi
            sleep 20
          done
          sudo ln -sf "$(command -v sing-box)" /usr/local/bin/sing-box || true
          sing-box version

      - name: Get sing-box version (for release body)
        id: sbver
        run: |
          set -euo pipefail
          ver="$(sing-box version 2>&1 | tr '\n' ' ')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "$ver"

      - name: Prepare /etc/sing-box
        run: |
          set -euo pipefail
          sudo rm -rf /etc/sing-box
          sudo mkdir -p /etc/sing-box
          sudo chmod 755 /etc/sing-box

      - name: Download geoip.db & geosite.db
        run: |
          set -euo pipefail
          sudo curl -L -o /etc/sing-box/geoip.db \
            https://github.com/lyc8503/sing-box-rules/releases/latest/download/geoip.db
          sudo curl -L -o /etc/sing-box/geosite.db \
            https://github.com/lyc8503/sing-box-rules/releases/latest/download/geosite.db

          ls -lh /etc/sing-box

      - name: Export geoip (from /etc/sing-box)
        run: |
          set -euo pipefail
          cd /etc/sing-box

          geoip_groups="$(sudo sing-box geoip list | awk 'NF{print}')"
          if [ -z "$geoip_groups" ]; then
            echo "No geoip groups found"
            exit 1
          fi

          echo "$geoip_groups" | while IFS= read -r group; do
            [ -n "$group" ] || continue
            echo "Export geoip: $group"
            sudo sing-box geoip export "$group"
          done

      - name: Export geosite (from /etc/sing-box)
        run: |
          set -euo pipefail
          cd /etc/sing-box

          geosite_groups="$(sudo sing-box geosite list | awk '{print $1}' | awk 'NF{print}')"
          if [ -z "$geosite_groups" ]; then
            echo "No geosite groups found"
            exit 1
          fi

          echo "$geosite_groups" | while IFS= read -r group; do
            [ -n "$group" ] || continue
            echo "Export geosite: $group"
            sudo sing-box geosite export "$group"
          done

      - name: Move & rename into repo folders (geoip/geosite)
        run: |
          set -euo pipefail

          # 清理旧目录
          rm -rf ./geoip ./geosite
          mkdir -p ./geoip ./geosite

          cd /etc/sing-box
          shopt -s nullglob

          # 1) 复制 db 到仓库根目录（上级目录）
          for f in geoip.db geosite.db; do
            [ -f "$f" ] || continue
            echo "Copy $f to repo root"
            sudo cp -f "$f" "../$f"
          done

          # 2) 分类 geoip-*（去掉 geoip- 前缀）
          for f in geoip-*; do
            [ -f "$f" ] || continue
            base="$f"
            base="${base#geoip-}"
            out="../geoip/${base}"
            echo "geoip -> $out"
            sudo cp -f "$f" "$out"
          done

          # 3) 分类 geosite-*（去掉 geosite- 前缀）
          for f in geosite-*; do
            [ -f "$f" ] || continue
            base="$f"
            base="${base#geosite-}"
            out="../geosite/${base}"
            echo "geosite -> $out"
            sudo cp -f "$f" "$out"
          done

          echo "Repo root geoip.db/geosite.db:"
          ls -lh ./geoip.db ./geosite.db || true

          echo "Repo ./geoip content:"
          ls -lh ./geoip || true

          echo "Repo ./geosite content:"
          ls -lh ./geosite || true

      - name: Commit & push to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 确保在 main 上提交
          git fetch origin main
          git checkout main

          git add -A geoip geosite geoip.db geosite.db

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          sb_ver="${{ steps.sbver.outputs.version }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            yymmddhhii="$(date +'%y%m%d%H%M')"
            title="manual:${yymmddhhii}"
          else
            # 使用触发的 lyc8503/sing-box-rules release 的 title
            title="release:${{ github.event.release.title }}"
          fi

          git commit -m "$title" -m "sing-box_ver:${sb_ver}"
          git push origin main
